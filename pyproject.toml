[project]
name = "my-cup"
version = "0.1.0"
description = "my_cup CPU verification (cocotb + pytest)"
requires-python = ">=3.12"
dependencies = [
    "cocotb>=2.1,<3",
    "pytest>=9,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[project.scripts]
mycup = "mycup.cli:main"
veridian-lsp = "mycup.veridian_lsp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mycup"]
