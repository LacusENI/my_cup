# my_cup 工具链配置
#
# 这个文件只放“数据和命令参数”，不放实现逻辑。
# 想改工具链时先看这里，再看 Makefile / mycup。

[project]
name = "my_cup"

[paths]
rtl = "rtl"
build = "build"
waves = "waves"
logs = "logs"
verilator_dir = ".verilator"
slang_dir = ".slang"
programs = "programs"
tests = "tests"

[sources]
package = "rtl/cpu_pkg.sv"
glob = "rtl/**/*.sv"

[lint]
tool = "verilator"
args = [
  "--lint-only",
  "-Wall",
  "--timing",
  "--bbox-sys",
  "-Wno-MULTITOP",
]
filelist = ".verilator/verilator.f"
log = "logs/lint.log"

[slang]
filelist = ".slang/slang.f"

[test]
args = ["-v"]

[cov]
dir = "logs/coverage"
# 覆盖率需要 Verilator >= 5.036（cocotb 2.1 的 VLT_MIN）；
# 当前流程固定使用 5.054，避免系统 apt 版本过旧。
min_version = "5.054"
verilator = ".tools/verilator/5.054/bin/verilator"
verilator_coverage = ".tools/verilator/5.054/bin/verilator_coverage"

[prog]
target = "tests/cpu/test_prog.py::test_prog_demo"

[format]
tool = "verible-verilog-format"
args = ["--indentation_spaces=4"]
glob = "rtl/**/*.sv"

[doctor]
required = [
  "uv",
  "iverilog",
  "verilator",
  "verible-verilog-format",
]
optional = [
  "slang-server",
  "verilator_coverage",
  "genhtml",
]
