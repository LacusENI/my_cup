name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: lint + cocotb tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python
        run: uv python install 3.13

      - name: Install HDL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator

      - name: Sync Python environment
        run: uv sync --frozen

      - name: Lint RTL
        run: uv run mycup lint

      - name: Run cocotb tests
        run: uv run mycup test
